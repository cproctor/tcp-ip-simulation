<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <head>
    <style>
      body {
        font-family: Helvetica;
      }
      .role {
        font-style: italic;
      }
      .message-template {
        border: 2px solid black;
        margin: 5px;
        padding: 10px;
        width: 400px;
      }
      .message-template li {
        list-style: none;
      }
      .header {
        font-weight: bold;
      }
      @media screen {
          body {
              max-width: 800px;
              margin: 0 auto;
          }
      }
      @media print {
        .instructions {
          page-break-after: always;
        }
        .node-instructions {
          page-break-after: always;
        }
      }
    </style>
  </head>
  <body>
    {% block content %}
    {% endblock %}
  </body>
</html>
