[project]
name = "tcp-ip-simulation"
version = "0.1.0"
description = "Generates materials for a classroom simulation of TCP/IP"
authors = [
    {name = "Chris Proctor",email = "chris@chrisproctor.net"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2 (>=3.1.6,<4.0.0)"
]

[project.scripts]
generate = "tcp_ip_simulation.cli:generate"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = ["tcp_ip_simulation/templates/*.html"]
